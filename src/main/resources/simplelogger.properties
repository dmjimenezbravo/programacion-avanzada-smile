# Configuracion de slf4j-simple (ver pom.xml).
#
# SMILE registra un mensaje de log por cada arbol entrenado (RandomForest,
# GradientTreeBoost) o por cada epoca (MLP), a nivel INFO. Con
# Options(200)/Options(300) eso son 200-300 lineas de ruido por ejecucion,
# ademas de la salida propia de los ejemplos. Se sube el umbral a WARN para
# que solo se vean avisos y errores reales.
org.slf4j.simpleLogger.defaultLogLevel=warn
